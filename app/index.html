<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint so dark mode never flashes light.
      (function () {
        var t = null
        try { t = localStorage.getItem('shit-coffee-theme') || localStorage.getItem('zerno-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <meta name="description" content="shit кофе: кофе с компанией в Петербурге. Заяц на пене и мягкий спутник с собой." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600;1,700&family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>shit кофе — кофе и кое-кто ещё</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;display:grid;place-items:center;background:var(--bg,#f7f2e9);z-index:9999;">
        <img src="/coffee-loader.svg" alt="Готовим кофе" style="width:min(48vw,190px);height:auto;user-select:none;pointer-events:none;" width="190" height="202" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
