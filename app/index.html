<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16120F" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDE8DF" />
    <meta name="theme-color" content="#16120F" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Set the theme and system bar colors before first paint so dark mode never flashes light.
      (function () {
        var t = null
        try { t = localStorage.getItem('shit-coffee-theme') || localStorage.getItem('zerno-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        // While the launch screen is up, page and system bars wear the splash colour in either
        // theme; bootScreen.ts hands them the theme's colour (data-theme-bg) when it goes.
        var bg = '%brand.background%'
        document.documentElement.dataset.themeBg = t === 'dark' ? '#16120F' : '#EDE8DF'
        document.documentElement.style.backgroundColor = bg
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', bg)
        }
      })()
    </script>
    <meta name="description" content="shit кофе: кофе с компанией в Петербурге. Заяц на пене и мягкий спутник с собой." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="shit кофе" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Not render-blocking: on a bad network the page must not stay white waiting for fonts. -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600;1,700&family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <title>shit кофе — кофе и кое-кто ещё</title>
    <!-- The launch screen's look, in the head so the very first paint already has it. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: %brand.background%; transition: opacity .32s ease; }
      #boot[data-gone] { opacity: 0; pointer-events: none; }
      #boot > .brand-loader { top: %brand.splashOffsetY%px; width: calc(%brand.splashIconSize%px * %brand.iconLogoWidth%); }

      /* The logo pours full of coffee, gives a little as it brims, steams, blinks, drains. Transforms and opacity only. */
      .brand-loader { --brand-cycle: 2.8s; position: relative; transform-origin: 50% 100%; animation: brand-squash var(--brand-cycle) ease-in-out .25s infinite; }
      :root { --brand-logo-mask: %brand.logoMask% center / contain no-repeat; --brand-logo-aspect: %brand.logoAspect%; }
      .brand-logo { position: relative; overflow: hidden; aspect-ratio: var(--brand-logo-aspect); background: %brand.logoColor%;
        -webkit-mask: var(--brand-logo-mask); mask: var(--brand-logo-mask); }
      .brand-coffee { position: absolute; inset: -14% 0 0; transform: translateY(100%); animation: brand-pour var(--brand-cycle) cubic-bezier(.45, 0, .55, 1) .25s infinite; }
      .brand-coffee::before { content: ''; position: absolute; left: 0; top: 0; width: 200%; height: 15%; background: %brand.wave% repeat-x 0 0 / 50% 100%; animation: brand-wave 1.1s linear infinite; }
      .brand-coffee::after { content: ''; position: absolute; inset: 14% 0 0; background: %brand.logoFill%; }
      .brand-eye { position: absolute; z-index: 1; aspect-ratio: 1; border-radius: 50%; background: %brand.iconBackground%; animation: brand-blink 3s ease-in-out .2s infinite; }
      .brand-steam { position: absolute; left: 0; right: 0; bottom: 96%; height: 45%; pointer-events: none; }
      .brand-steam > i { position: absolute; bottom: 0; width: 7%; height: 60%; margin-left: -3.5%; border-radius: 999px; opacity: 0;
        background: linear-gradient(to top, transparent, %brand.logoColor% 45%, transparent); animation: brand-steam var(--brand-cycle) ease-out .25s infinite; }
      .brand-steam > i:nth-child(1) { left: 40%; }
      .brand-steam > i:nth-child(2) { left: 50%; animation-delay: .4s; height: 75%; }
      .brand-steam > i:nth-child(3) { left: 60%; animation-delay: .55s; }
      @keyframes brand-pour { 0% { transform: translateY(100%); } 44%, 66% { transform: translateY(0); } 100% { transform: translateY(100%); } }
      @keyframes brand-wave { to { transform: translateX(-50%); } }
      @keyframes brand-squash { 0%, 40%, 56%, 100% { transform: none; } 45% { transform: scale(1.05, .95); } 50% { transform: scale(.98, 1.02); } }
      @keyframes brand-steam { 0%, 44% { opacity: 0; transform: translate(0, 30%) scale(.6, .5); } 56% { opacity: .55; transform: translate(-25%, -5%) scale(.9, .85); }
        68% { transform: translate(25%, -40%) scale(1, 1); } 80%, 100% { opacity: 0; transform: translate(-10%, -80%) scale(1.1, 1.1); } }
      @keyframes brand-blink { 0%, 22%, 30%, 100% { transform: scaleY(1); } 26% { transform: scaleY(.12); } }
      @media (prefers-reduced-motion: reduce) {
        .brand-loader, .brand-coffee, .brand-coffee::before, .brand-eye, .brand-steam > i { animation: none; }
        .brand-coffee { transform: translateY(45%); }
      }
    </style>
  </head>
  <body>
    <!--
      Launch screen, drawn by the browser before any script: the same picture Android shows on its
      PWA splash (the logo where and as big as Android draws it), so the hand-over is invisible. The
      loader plays until the menu is ready (bootScreen.ts takes it away).
      The brand values come from brand.json; .brand-loader is also <Loader> (src/brand/loaderMarkup.ts).
    -->
    <div id="boot" role="status" aria-label="Загружаем меню"><div class="brand-loader">%brand.loader%</div></div>
    <div id="root">
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
